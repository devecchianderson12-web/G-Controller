# Compila GController.exe (portable) y GController-Setup.exe (instalador) en cada push a main
# y los sube a la release de la versión actual (la crea si no existe, si existe la actualiza).
# Para sacar una update: cambiar Version en src/App.cs y hacer push a main.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path src/App.cs -Pattern 'Version = "([0-9.]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar portable e instalador
        shell: cmd
        run: build.cmd

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = @("GController.exe", "GController-Setup.exe")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $tag --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
